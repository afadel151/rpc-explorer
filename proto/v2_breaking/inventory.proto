syntax = "proto3";

package inventory;

// v2_breaking: TWO breaking changes vs v1:
//   1. field 6 stock_quantity changed from int32 → string (wire-type mismatch)
//   2. rpc GetProductDetails renamed to GetProduct
//
// A v1 client calling this server will observe:
//   - GetProductDetails → UNIMPLEMENTED (method removed)
//   - If it somehow calls GetProduct, field 6 decodes incorrectly (observe & record).

service InventoryService {
  rpc Ping(PingRequest)                   returns (PingResponse);
  rpc CalculateFactorial(FactorialRequest) returns (FactorialResponse);
  rpc GetProduct(ProductRequest)           returns (ProductDetails);  // ← RENAMED
  rpc UpdateStock(UpdateStockRequest)      returns (UpdateStockResponse);
  rpc StreamAnalytics(AnalyticsRequest)    returns (stream AnalyticsPoint);
  rpc ResetInventory(ResetRequest)         returns (ResetResponse);
}

message PingRequest {
  int32 sleep_ms = 1;
}

message PingResponse {
  bool pong = 1;
  int64 server_time_ns = 2;
}

message FactorialRequest {
  int32 n = 1;
}

message FactorialResponse {
  string result = 1;
  int32 digits = 2;
}

message ProductRequest {
  string product_id = 1;
}

message ProductDetails {
  string product_id = 1;
  string name = 2;
  string description = 3;
  int64 price_cents = 4;
  string currency = 5;
  string stock_quantity = 6;      // ← BREAKING: was int32, now string
  repeated string tags = 7;
  map<string, string> attributes = 8;
  string warehouse = 9;
}

message UpdateStockRequest {
  string product_id = 1;
  int32 delta = 2;
  string idempotency_key = 3;
}

message UpdateStockResponse {
  string product_id = 1;
  int32 new_quantity = 2;
  bool applied = 3;
}

message AnalyticsRequest {
  string metric = 1;
  int32 count = 2;
  int32 interval_ms = 3;
}

message AnalyticsPoint {
  int32 seq = 1;
  string metric = 2;
  double value = 3;
  double running_avg = 4;
  int64 server_ts_ns = 5;
}

message ResetRequest {}

message ResetResponse {
  bool reset = 1;
}
